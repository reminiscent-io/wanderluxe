sonar.organization=reminiscent-io
sonar.projectKey=reminiscent-io_wanderluxe
sonar.projectName=WanderLuxe

# Source configuration
sonar.sources=src,server,supabase/functions
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# TypeScript
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.node.json

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  src/**/*.d.ts,\
  src/test/**,\
  src/vite-env.d.ts,\
  public/**,\
  dist/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
